name: Patch and Build

on:
  push:
    branches: [ "**" ]
  pull_request:

env:
  IMAGE_NAME: ghcr.io/azisabanetwork/chiyomixin

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for the commit-count build number
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build
        run: ./gradlew createChiyoMixinJar
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ChiyoMixin
          path: build/libs/ChiyoMixin-paperclip-*.jar

      # Container image (pushed for branch pushes only, not for PRs)
      - name: Compute image tags
        id: meta
        run: |
          mc_version=$(grep '^mcVersion=' gradle.properties | cut -d= -f2)
          build=$(git rev-list --count HEAD)
          sha=$(git rev-parse --short=7 HEAD)
          branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${branch}"
            echo "${IMAGE_NAME}:sha-${sha}"
            # Version tags only from the main line for this Minecraft version
            if [ "${GITHUB_REF_NAME}" = "ver/${mc_version}" ]; then
              echo "${IMAGE_NAME}:${mc_version}"
              echo "${IMAGE_NAME}:${mc_version}-${build}"
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0
